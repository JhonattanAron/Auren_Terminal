    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      .ui{font-family:Inter,'Segoe UI',sans-serif}.mono{font-family:'Cascadia Code',Consolas,monospace}.muted{fill:#85899a}.soft{fill:#b7bbc9}.white{fill:#f4f3fa}.violet{fill:#b59aff}.cyan{fill:#79d8ed}.green{fill:#73e0a6}.yellow{fill:#f2c879}.line{stroke:#282a38}.tiny{font-size:12px}.small{font-size:14px}.medium{font-size:16px}.bold{font-weight:700}
    </style>
